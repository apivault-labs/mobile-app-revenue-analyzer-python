[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-app-revenue-analyzer"
version = "0.1.0"
description = "Python SDK for Mobile App Revenue & Competitor Analyzer on Apify. Estimate any iOS app's revenue and downloads, see chart positions, update cadence, in-app purchases, developer portfolio and direct competitors. Paste an App Store link or app ID. Bulk, no login, no API key. Pay per result, $1/1K. CSV"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ApiVault Labs" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.31.0"]
keywords = ["app-store", "mobile-app", "revenue-estimation", "downloads-estimate", "competitor-analysis", "ios", "apify", "python-sdk"]

[project.urls]
Homepage = "https://github.com/apivault-labs/mobile-app-revenue-analyzer-python"
Documentation = "https://github.com/apivault-labs/mobile-app-revenue-analyzer-python#readme"
"Apify Actor" = "https://apify.com/apivault_labs/app-revenue-analyzer"
"Bug Tracker" = "https://github.com/apivault-labs/mobile-app-revenue-analyzer-python/issues"

[tool.setuptools.packages.find]
include = ["mobile_app_revenue_analyzer*"]
